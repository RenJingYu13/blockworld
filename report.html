<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玩家违规举报 - Block World</title>
<link rel="stylesheet" href="css/style.css">
<script>
  // 解决同根域名跨域（www 与 pan）
  document.domain = "blockworld.eu.cc";
  // 提前阻止表单默认提交，避免脚本加载失败跳转
  document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('reportForm');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
    });
  });
</script>
</head>
<body>
<div id="header-placeholder"></div>
<div class="page-wrap">
  <div class="wrap">
    <div class="page-box">
      <h2>玩家违规举报</h2>
      <div class="content">
        <form class="report-form" id="reportForm">
          <div class="form-group">
            <label>你的游戏ID <span style="color:#ff4444;">*</span></label>
            <input type="text" name="user_id" placeholder="请输入游戏内真实ID，便于核实" required autocomplete="off">
          </div>
          <div class="form-group">
            <label>被举报玩家ID <span style="color:#ff4444;">*</span></label>
            <input type="text" name="target_id" placeholder="请输入违规玩家游戏内真实ID" required autocomplete="off">
          </div>
          <div class="form-group">
            <label>违规类型 <span style="color:#ff4444;">*</span></label>
            <select name="violation_type" required>
              <option value="">请选择具体违规类型</option>
              <option value="作弊/外挂/矿透">作弊/外挂/矿透</option>
              <option value="恶意偷家/破坏">恶意偷家/破坏</option>
              <option value="辱骂/刷屏/引战">辱骂/刷屏/引战</option>
              <option value="诈骗/骗物品">诈骗/骗物品</option>
              <option value="其他违规">其他违规</option>
            </select>
          </div>
          <div class="form-group">
            <label>发生时间</label>
            <input type="text" name="happen_time" placeholder="例：2026-03-15 20:00，越精确越易核查" autocomplete="off">
          </div>
          <div class="form-group">
            <label>违规详情描述 <span style="color:#ff4444;">*</span></label>
            <textarea name="detail" placeholder="请详细描述违规过程、场景，可补充相关证据说明" required></textarea>
          </div>
          <div class="submit-box">
            <button type="submit" class="btn" id="submitBtn">提交举报</button>
          </div>
        </form>
        <div class="tip">
          ✦ 恶意举报/虚假举报将被处以游戏内封禁处罚<br>
          ✦ 举报信息将自动留存，管理员将在1-2个工作日内核查<br>
          ✦ 核查结果将通过游戏内公告/私信同步，请注意查收
        </div>
      </div>
    </div>
  </div>
</div>
<footer>
  <div class="wrap">
    <p>© 2026 Block World Server 所有权利保留</p>
  </div>
</footer>
<script src="js/main.js"></script>
<script src="js/report.js"></script>
</body>
</html>
